# apps/customer, served as static files (ADR-0059 §4).
#
# Two jobs beyond handing out files: the SPA fallback, and the response headers
# helmet sends for the API. The SPA is served by nginx, so nothing in
# `apps/api` can set them for this origin — they are restated here or they do
# not exist (ADR-0020).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Not the version, on either origin.
    server_tokens off;

    # helmet's defaults, restated, one line each so the set can be diffed
    # against helmet's. `always` so they are present on error responses too,
    # which is where a missing `nosniff` matters most.
    #
    # **No `location` block below may declare an `add_header`**: nginx replaces
    # the inherited set rather than adding to it, silently, so every header
    # here would vanish from that location. That is why `/assets/` uses
    # `expires` — a different directive, with no such effect.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # `0`, not `1`: helmet sets it explicitly to switch the legacy XSS auditor
    # **off**, because its filtering was itself exploitable. Restating it as
    # anything else would be worse than omitting it.
    add_header X-XSS-Protection "0" always;
    # Meaningful only over TLS, which terminates at the platform's proxy. Sent
    # anyway: a browser ignores it on a plain-HTTP response, so the cost of
    # having it here is nothing and the cost of adding it later, after a
    # deployment has run without it, is a window where it was missing.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # No Content-Security-Policy. helmet's default policy forbids inline
    # styles, and a Tailwind build emits them; shipping a policy the app
    # violates on first paint would mean either a broken app or a policy
    # loosened until it says nothing. It is a decision, not an oversight, and
    # it is the one thing here worth revisiting with a nonce-aware build.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Vite fingerprints everything under `assets/`, so the content of a given
    # URL never changes. `expires` rather than `add_header Cache-Control`, for
    # the inheritance reason given above.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # `index.html` names those fingerprinted files, so it must never be the
    # stale half of a deploy.
    location = /index.html {
        expires -1;
    }

    # The SPA fallback: the router owns every path, so anything that is not a
    # file on disk is the app being deep-linked into (ADR-0049 as carried by ADR-0055).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
