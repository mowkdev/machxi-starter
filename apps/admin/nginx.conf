# apps/admin, served as static files (ADR-0059 §4).
#
# Two jobs beyond handing out files: the SPA fallback, and the response headers
# helmet sends for the API. The SPA is served by nginx, so nothing in
# `apps/api` can set them for this origin — they are restated here or they do
# not exist (ADR-0020).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Not the version, on either origin.
    server_tokens off;

    # helmet's defaults, restated, one line each so the set can be diffed
    # against helmet's. `always` so they are present on error responses too,
    # which is where a missing `nosniff` matters most.
    #
    # **No `location` block below may declare an `add_header`**: nginx replaces
    # the inherited set rather than adding to it, silently, so every header
    # here would vanish from that location. That is why `/assets/` uses
    # `expires` — a different directive, with no such effect.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # `0`, not `1`: helmet sets it explicitly to switch the legacy XSS auditor
    # **off**, because its filtering was itself exploitable. Restating it as
    # anything else would be worse than omitting it.
    add_header X-XSS-Protection "0" always;
    # Meaningful only over TLS, which terminates at the platform's proxy. Sent
    # anyway: a browser ignores it on a plain-HTTP response, so the cost of
    # having it here is nothing and the cost of adding it later, after a
    # deployment has run without it, is a window where it was missing.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The policy (ADR-0073 §9). Scripts are what an injection would need and
    # `script-src 'self'` is what stops it: the bundle is fingerprinted files
    # under `/assets/` and nothing inline, so the first inline `<script>` a
    # build step ever emits breaks the app loudly — which is the point, and
    # nonces are the answer then. `style-src 'unsafe-inline'` is Tailwind's
    # price and is stated rather than hidden: Radix and sonner write `style`
    # attributes, and `style-src-attr` falls back to this directive.
    # `frame-ancestors 'none'` is `X-Frame-Options: DENY` above, said in the
    # header modern browsers read first. `object-src 'none'` rather than the
    # `'self'` it would inherit: nothing here embeds a plugin document, and a
    # same-origin `<object>` is the one loophole `default-src` leaves open.
    #
    # `__API_ORIGIN__` is not a value: the Dockerfile's runtime stage
    # substitutes the `VITE_API_URL` build argument for it, because nginx
    # cannot read Vite's, and refuses to build an image with it unfilled. The
    # API is the one origin the bundle fetches from — the catalogues are code,
    # not a runtime JSON fetch (ADR-0046 §3), and the fonts are self-hosted —
    # so a fork that wires an error reporter (ADR-0066 §3) adds its ingest
    # origin to `connect-src` here, beside the API's.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Vite fingerprints everything under `assets/`, so the content of a given
    # URL never changes. `expires` rather than `add_header Cache-Control`, for
    # the inheritance reason given above.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # `index.html` names those fingerprinted files, so it must never be the
    # stale half of a deploy.
    location = /index.html {
        expires -1;
    }

    # The SPA fallback: the router owns every path, so anything that is not a
    # file on disk is the app being deep-linked into (ADR-0049).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
