packages:
  - "apps/*"
  - "packages/*"

# One version per shared dependency, declared once (ADR-0059 §3 as carried by
# ADR-0073 §7). The rule for what lives here is a threshold rather than taste:
# a version **ten or more workspaces declare** moves into the catalog, because
# at that count a bump is a sweep and a drift is invisible — `typescript` was
# already `5.9.3` in sixteen manifests and `^5.9.3` in the seventeenth, which
# is exactly the failure the catalog removes. Below the threshold the version
# stays in the manifest that needs it, where a workspace that must diverge can
# say so without a second catalog entry.
#
# Pinning follows the same rule as the manifests: **exact for the runtime
# framework and the compiler, caret for everything else** — so `typescript` is
# exact here and `eslint`, `vitest` and `@types/node` are carets.
#
# `@repo/vitest-config` keeps its own `vitest` **peer** range (`^5`) rather
# than `catalog:`: a peer is a compatibility statement to consumers, and
# narrowing it to the version this repository happens to run would make the
# package lie about what it works with.
#
# `vite` is here because Vitest 5 made it a peer rather than a dependency: every
# workspace that runs Vitest declares it, which puts it over the threshold, and
# declaring it is what keeps it one version — `autoInstallPeers` would answer an
# undeclared peer with the newest release the range allows, a second copy of
# the bundler beside the one both apps build with.
#
# `@types/node` tracks the **runtime floor's** major, not the registry's newest
# (`D21.4`): the types describe the Node the code runs on, and the floor is
# Node 24 (ADR-0073 §4) — so 24's types are the true surface, and a newer
# major's would type-check calls to APIs the floor does not have. `pnpm
# outdated` listing a newer major from here on is the floor working, not a
# major left behind; the types move with the floor, in the pull request that
# moves it. The reason is in `renovate.json`'s register, and the hold is the
# `overrides` entry below.
#
# `typescript` is the native compiler, 7, since `D21.6` (ADR-0076): every
# workspace's `check-types` is `tsc -b` on it. 7 has no JavaScript API, so the
# one tool that needs one — `typescript-eslint`, for the type-aware rules — is
# given 6.0 by the one manifest that installs it: `@repo/eslint-config`
# declares `typescript` as `npm:typescript@6.0.3`, and `typescript-eslint`'s
# peer resolves there. That alias is the second compiler version in the
# lockfile, deliberately, and the only one; `scripts/docs-hygiene` asks for
# exactly the two.
catalog:
  "@types/node": ^24.19.0
  eslint: ^10.11.0
  typescript: 7.0.2
  vite: ^8.3.0
  vitest: ^5.0.1

# A dependency held below a version is held here, once (ADR-0074 §2). A pin
# in a manifest and `renovate.json`'s `allowedVersions` bind what a workspace
# declares and what Renovate proposes — and nothing else: `autoInstallPeers`
# answers a peer range no manifest mentions with whatever the registry has,
# which is how the held `jsdom` arrived a second time, as vitest's peer, in the
# workspaces that never declared it. An override binds the resolution itself.
# The reason for each hold stays in `renovate.json`'s register, beside the
# rule that keeps Renovate from proposing past it; `scripts/docs-hygiene` asks
# the lockfile for one version of every name listed here.
#
# `@types/node` is held at the floor's major for the reason the catalog states.
# The catalog binds the manifests; this binds the peers nobody declares —
# without it `autoInstallPeers` answered `@inquirer/*`'s and `msw`'s optional
# peer with a second, older copy, and Vitest resolved twice around it.
overrides:
  "@types/node": ^24.19.0
  jsdom: 30.0.1

# A peer range a plugin has not yet widened, admitted by name and never by a
# second copy of the tool (ADR-0074 §2; `D21.2`). One entry per plugin, each
# naming the release it waits for — when that release lands, the entry goes.
#
# `eslint-plugin-react` 7.37.5 declares `eslint` up to `^9.7`, and no release
# declaring 10 exists yet: jsx-eslint/eslint-plugin-react#3977 ("ESLint v10
# compatibility") is the upstream issue. Its one ESLint 10 breakage that
# reaches this tree is `settings.react.version: "detect"`, which calls the
# `context.getFilename()` ESLint 10 removed (#4018) — so `react.js` in
# `@repo/eslint-config` states the React major instead of detecting it. The
# entry goes with the first release whose peer range names 10.
#
# `typescript-eslint` 8.x declares `typescript` below 6.1, and no release
# admitting 7 exists yet (`D21.6`, ADR-0076). The instance the rules run on is
# `@repo/eslint-config`'s, whose `typescript` is the 6.0 alias, so its peer is
# met. The four entries below are for a second instance nothing loads:
# `eslint-plugin-boundaries` in both apps reaches `@typescript-eslint/parser`
# through `eslint-module-utils`' optional peer, where the apps' compiler is 7
# — and under flat config `eslint-module-utils` parses with the parser object
# the config hands it (the 6.0 one), never by requiring a parser path. The
# entries go with the first `typescript-eslint` release whose peer range
# names 7, and the alias with them.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: "10"
    "@typescript-eslint/parser>typescript": "7"
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"

# ─── pnpm's own settings ──────────────────────────────────────────────────────
# pnpm 12 no longer reads the `pnpm` field of `package.json` (ADR-0073 §4 as
# amended at `D20.3`); every setting below used to live there or in a default.

# Which dependencies may run an install script, one answer each — pnpm 12's
# `allowBuilds` in place of 10's `onlyBuiltDependencies` list, and it refuses
# the install rather than warning when a package it has no answer for wants to
# run one. `argon2` is a native addon and has to build or link its binary, and
# `esbuild` fetches its platform binary. The two `false`s are the decisions
# this tree has been running with since before they had to be written down:
# `msw`'s script copies a service worker into a public directory each app
# already commits, and `unrs-resolver`'s fetches a binding its own optional
# dependencies already resolve.
allowBuilds:
  argon2: true
  esbuild: true
  msw: false
  unrs-resolver: false

# Peers are installed rather than warned about. Stated here because pnpm 12
# does not read `.npmrc` — the file carried this one line and nothing else, so
# it is gone rather than left behind saying something no tool reads. The rule
# it holds up is `renovate.json`'s: a provider left on an unsatisfiable exact
# peer is answered by a second copy of the peer instead of by a loud failure,
# which is why `@vitest/coverage-v8` is pinned with vitest.
autoInstallPeers: true

# The supply-chain cooldown, stated rather than inherited: a version has to
# have been on the registry for a day before a resolution may choose it.
#
# It guards the *choice* of a version and not the install of one already
# chosen. pnpm 12 also re-checks it against every entry of the lockfile on
# every install — so a lockfile committed the day a dependency moved refuses to
# install anywhere, the image builds and CI included, until the clock catches
# up. That is a check on the wrong event: by the time a version is in
# `pnpm-lock.yaml` it has been through a pull request and the gate. The
# cooldown therefore stays on for resolution (`pnpm add`, `pnpm update`, a
# Renovate branch) and the committed lockfile is trusted; `--no-trust-lockfile`
# re-checks it on demand.
#
# Renovate states the same cooldown (`renovate.json`'s `minimumReleaseAge`,
# "1 day"), so a version pnpm refuses is one Renovate does not propose — the
# two change together or not at all (ADR-0074 §2). The exception is
# Renovate's own: its vulnerability-alert pull requests clear the cooldown by
# default, so a `[SECURITY]` branch for a fix published today opens at once
# and its lockfile update is refused here. That branch is finished by hand,
# with the procedure below.
#
# A security fix younger than the cooldown is taken by overriding it for that
# one install, in the branch that takes the fix, naming the package so nothing
# else is re-resolved without the cooldown — `pnpm add <pkg>@<version>
# --config.minimum-release-age=0` or `pnpm update <pkg>
# --config.minimum-release-age=0`, never a bare `pnpm update` — with the
# advisory named in the pull request. The setting here is never lowered to let
# one version through.
minimumReleaseAge: 1440
trustLockfile: true
