# Local development infrastructure (ADR-0007).
#
# Postgres and, since `D14.6`, Mailpit — the apps themselves run on the host so
# hot reload and the debugger stay native. (`docker/prod/compose.yaml` is the
# other, unrelated file: the reference *deployment*, ADR-0059 §6.)
#
# Credentials come from the ROOT .env (ADR-0004), which is also what the API and
# the drizzle tooling read, so there is one source of truth. Always invoke this
# file through the root scripts (`pnpm docker:up`, `docker:down`, `docker:reset`,
# `docker:logs`) — they pass `--env-file .env`; a bare `docker compose up` from
# this directory has no values to substitute.
name: machxi-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: machxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, only when the data volume is empty. Extensions are NOT
      # created here — migration 0000 does `CREATE EXTENSION citext` so every
      # environment (dev, test, CI, production) gets them identically (ADR-0008).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [machxi]

  # The local mail server (ADR-0066 §1).
  #
  # What a local API talks to since `D18.4`: `.env.example` ships
  # `MAIL_TRANSPORT=smtp` and the `SMTP_*` defaults are this service's, so a
  # clone that has run `pnpm docker:up` can read its own mail at
  # http://localhost:8025 — which is what `pnpm test:e2e` does (ADR-0071
  # §Consequences). `MAIL_TRANSPORT=log` is the way back to a stack with no mail
  # server; it delivers nothing and this container is then merely cheap.
  #
  # No volume: a development inbox is scratch data by definition, and keeping
  # it across a `docker compose down` would only be a thing to explain.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: machxi-mailpit
    restart: unless-stopped
    environment:
      # A bounded ring buffer, so a loop that sends ten thousand messages
      # during a test costs a fixed amount of memory.
      MP_MAX_MESSAGES: 500
      # Accept anything as credentials over plaintext. This is a development
      # relay on a loopback port; the point is that `SMTP_USER`/`SMTP_PASSWORD`
      # can be set or left out and either works.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # SMTP, and the web inbox. Both are host ports, so both are overridable
      # for the same reason POSTGRES_PORT is.
      #
      # **Bound to the loopback interface since `D18.4`**, and the difference
      # from Postgres beside it is what the inbox now holds: the API delivers
      # here, so these messages carry live single-use links that activate an
      # account (ADR-0071 §1) and Mailpit's API has no authentication at all.
      # Published on every interface, anyone on the same network could read one
      # and spend it. Nothing local loses anything — the API and the browser
      # tier both run on the host, and a container on this network reaches
      # `mailpit:1025` by name rather than through a published port.
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      # The image is `scratch`-based and has no shell, so this is the exec form
      # against the binary's own readiness endpoint — `pnpm docker:up` passes
      # `--wait`, which is what makes "Mailpit healthy" a checkable claim.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [machxi]

volumes:
  # Named, so `down` keeps the data and `down -v` (pnpm docker:reset) is the
  # single documented way to wipe it.
  postgres-data:

networks:
  # Named, so future services (an api container, redis) can join by name.
  machxi:
    name: machxi-local
