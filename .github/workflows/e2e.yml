# The browser tier (ADR-0059 §1), nightly and on demand — never on push.
#
# ADR-0052 §The browser tier put `pnpm test:e2e` beside the gate and never in
# it: forty-odd serial specs against a seeded stack cost more on every push
# than they save, and a nightly run catches the same regressions within a day.
# ADR-0059 carries that decision into CI rather than re-litigating it with a
# scheduler, which is why this file has `schedule` and `workflow_dispatch` and
# no `push` trigger.
#
# Unlike the gate, this workflow does start a stack: the suite has no
# `webServer` (apps/*/playwright.config.ts says why — starting a stack the tier
# does not own hides which half broke), so the stack is brought up here the way
# a developer brings it up, with the documented commands.
name: e2e

on:
  schedule:
    # 03:00 UTC, after the day's pushes and before the operator's morning.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: playwright, both apps
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: machxi
          POSTGRES_PASSWORD: machxi
          POSTGRES_DB: machxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U machxi -d machxi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # The mailbox, beside Postgres and for the same reason: without it the
      # tier has nothing to read (ADR-0071 §Consequences). Every flow in that
      # record is a single-use token delivered in a link, so a run with no mail
      # server can watch a form say "we have sent you a link" and prove nothing
      # after it.
      #
      # **No `options: --health-cmd`.** The image is built on `scratch` and has
      # no shell, and GitHub runs a health command through one — so the
      # readiness poll is in the "Start the stack" step below, beside the three
      # servers it already waits for. Both ports are published because both are
      # used from the host: the API sends on 1025 and the tier reads on 8025.
      mailpit:
        image: axllent/mailpit:v1.33.1
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token left behind (D36.4's review): nothing in this job pushes, so
        # the checkout's `GITHUB_TOKEN` is not persisted for the install and the
        # test scripts that run after it.
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The advisory check, nightly beside the browser tier and never in the
      # gate (ADR-0074 §1): a fresh advisory is a fact about the world, not
      # about the diff, so it must not redden a push that did not cause it.
      # Reported and never gating — `continue-on-error` shows the step red in
      # the run's summary while the job goes on to the suite it exists for, and
      # the annotation puts the advisory on the run's page rather than only in
      # a step log nobody opens on a green job. `--prod` because the runtime
      # tree is what ships.
      - name: Audit the runtime dependencies
        continue-on-error: true
        run: |
          pnpm audit --prod || {
            echo "::warning title=pnpm audit::runtime advisories found — see this step's log"
            exit 1
          }

      # The examples carry `MAIL_TRANSPORT=smtp` since `D18.4`, pointed at the
      # `SMTP_*` defaults that are the Mailpit service above — so the tier can
      # read the links it follows without this step overriding anything. One
      # writer: the example file states the local setup, and this copies it.
      - name: Copy the example environment files
        run: |
          cp .env.example .env
          cp apps/admin/.env.example apps/admin/.env
          cp apps/customer/.env.example apps/customer/.env

      # One browser, installed once: both apps depend on the same
      # `@playwright/test` version, so one download serves both runs.
      - name: Install Chromium
        run: pnpm --filter admin exec playwright install --with-deps chromium

      # The same SQL `docker/local` mounts into `docker-entrypoint-initdb.d`,
      # run against the service container, exactly as `gate.yml` does it: the
      # two roles and the test database (ADR-0007 as carried by ADR-0061 §1).
      # Without it `db:setup` cannot connect — every tooling connection is
      # `DATABASE_URL_OWNER` with no fallback (ADR-0008 as carried by
      # ADR-0061 §1), and `machxi_owner` does not exist until this runs.
      - name: Create the roles and the test database
        # `PGPASSWORD` rather than the password in the URI alone: `01-test-db.sql`
        # ends with a `c machxi_test`, and a reconnect that had to re-prompt
        # would hang the job rather than fail it.
        env:
          PGPASSWORD: machxi
        run: |
          for f in docker/local/postgres/init/*.sql; do
            psql "postgres://machxi@localhost:5432/machxi" -v ON_ERROR_STOP=1 -f "$f"
          done

      # The documented setup: migrate, seed the super admin from `.env`, then
      # the dev fixtures the customer specs sign in as (`--dev`).
      - name: Migrate and seed
        run: |
          pnpm db:setup
          pnpm db:seed -- --dev

      # `pnpm dev` is persistent, so each server is backgrounded and then
      # polled for. The API is polled on `/health/ready`, not `/live`: the
      # suite needs the database reachable, not merely the process alive
      # (ADR-0016). `TURBO_UI=stream` because turbo's TUI has no terminal here
      # and its output has to reach the log the failure step tails.
      - name: Start the stack
        env:
          TURBO_UI: stream
        run: |
          pnpm dev --filter api > /tmp/api.log 2>&1 &
          pnpm dev --filter admin > /tmp/admin.log 2>&1 &
          pnpm dev --filter customer > /tmp/customer.log 2>&1 &
          node --input-type=module -e '
            const wait = async (url) => {
              for (let i = 0; i < 120; i += 1) {
                try {
                  const res = await fetch(url);
                  if (res.ok) { console.log(`up: ${url}`); return; }
                } catch {}
                await new Promise((r) => setTimeout(r, 1000));
              }
              throw new Error(`timed out waiting for ${url}`);
            };
            await wait("http://localhost:4000/health/ready");
            await wait("http://localhost:3001/");
            await wait("http://localhost:3002/");
            // The mailbox, polled here rather than as a service health check:
            // the image has no shell for GitHub to run one in.
            await wait("http://localhost:8025/readyz");
          '

      - name: Run the browser tier
        run: pnpm test:e2e

      - name: Server logs
        if: failure()
        run: tail -n 200 /tmp/api.log /tmp/admin.log /tmp/customer.log

      # A retained trace records the confirmation link the walk followed, whose
      # fragment is a single-use credential with a day to live (ADR-0071 §1).
      # Harmless here — this job's database and mailbox die with it, so the token
      # is dead before the artifact exists — and it stops being harmless the
      # first time this workflow is pointed at a shared environment.
      - name: Playwright reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/admin/playwright-report
            apps/admin/test-results
            apps/customer/playwright-report
            apps/customer/test-results
          retention-days: 7
          if-no-files-found: ignore
