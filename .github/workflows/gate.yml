# The gate (ADR-0059 §1), run on every push to `main` and every pull request.
#
# What a pull-request run proves (ADR-0082 §1–§2, lanes on one machine and one
# `main`, a delta on ADR-0059 §1–§2). Every lane is one branch and one pull
# request, and every step is one commit pushed to it. A step ends locally on
# the step check — the fast loop and the integration files its change reaches —
# and never runs the whole tree; this workflow does, on every push, over the
# head merged into `main` as GitHub builds the pull request's merge ref. So
# each run is the whole-tree proof of the lane as it stands after that step,
# against the `main` of the moment, without the lane merging anything. The
# next step reads this run before it builds and fixes forward when it is red,
# and `/ship` merges the pull request only once the run on its last commit is
# green. A burst of pushes costs one run, the last: the cancellation below.
#
# It runs the five documented links and nothing else — `pnpm lint`,
# `pnpm check-types`, `pnpm test`, `pnpm size`, `pnpm format:check`, in that
# order (ADR-0052 as carried by ADR-0057 §8). There is deliberately no
# CI-only script: a green pipeline and a green terminal have to mean the same
# thing, or the pipeline is a second, weaker gate.
#
# The first link carries more than eslint. `lint` depends on the repo-level
# script tests, on `docs:check` and on each app's `i18n:check` through the task
# graph (ADR-0026 as carried by ADR-0073 §6 and ADR-0074 §1), so `pnpm lint`
# below runs all three here and on a developer's machine: the checks that could
# go red with nothing watching them fail the gate at its first step. Listing
# them as `run:` steps of their own is exactly the CI-only script the paragraph
# above refuses.
#
# Every `uses:` is pinned to a commit digest with its tag in a trailing
# comment (ADR-0073 §7). A moving major tag is a write-access-shaped hole: the
# owner of the action — or anyone who takes that account — can repoint `v4` at
# a commit this repository never read, and it runs with the workspace, the
# lockfile and whatever the job's token can reach. The digest is the only
# reference GitHub cannot repoint. `helpers:pinGitHubActionDigests` in
# `renovate.json` proposes the next digest weekly, so the pin is maintained
# rather than frozen, and `scripts/docs-hygiene.test.mjs` refuses a `uses:`
# that has no digest — including in `e2e.yml`, which is pinned the same way.
#
# The browser tier stays out (ADR-0052 §The browser tier, carried by ADR-0059
# §1): it needs a running stack and a seeded database, and it runs nightly in
# `e2e.yml`.
name: gate

on:
  # `main` on push, because the required check has to exist for the commit
  # that is actually on `main` (ADR-0059 §2). No step reaches `main` directly
  # any more (ADR-0082 §1): `main` takes a lane's pull-request merge, made
  # by `/ship`, and the documents-only commits `/scope` pushes straight to it —
  # a scoping, a lane's opening, a revision while a record is `proposed` —
  # and this is the run that proves each of them on `main`. A lane branch is
  # covered by `pull_request` alone, one run per push rather than two.
  push:
    branches: [main]
  pull_request:

# Two kinds of group (D36.4). A pull request's runs share one group per ref,
# and a second push cancels the first: a step pushed while the last step's run
# is going supersedes it, and the next step reads the run on the newest commit.
# A run on `main` is grouped by its commit, so no two of them ever share a
# group. Neither is cancelled nor dropped: with one group for all of `main`, a
# third push while one run was going and a second was pending replaced the
# pending run, and the commit it was for never got the required check
# (ADR-0059 §2). `cancel-in-progress` is on for pull requests alone.
# `scripts/docs-hygiene.test.mjs` evaluates both expressions for both events.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gate-pr-{0}', github.ref) || format('gate-main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: lint, check-types, test, size, format:check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # The developer's cluster, with the developer's credentials. `machxi` is
      # the superuser the container bootstraps with; nothing in the repository
      # connects as it any more (ADR-0061) — the committed `.env.example` and
      # `apps/api/.env.test` name `machxi_app` and `machxi_owner`, and those two
      # roles are created by the init directory replayed below, before either
      # file is copied. ADR-0004 fixes those files as the ones the suite
      # follows, and CI matches them rather than exporting a URL, because
      # `packages/db`'s tooling loads the root `.env` **without** overriding
      # (`src/tooling/env.ts`): an exported `DATABASE_URL_TEST` would win there
      # and decide which database that package's own integration run rebuilds.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: machxi
          POSTGRES_PASSWORD: machxi
          POSTGRES_DB: machxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U machxi -d machxi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo's local cache, so a re-run of an unchanged task is a cache hit
      # here exactly as it is on a developer's machine (ADR-0026). Which tasks
      # may be cached is that record's decision, not this file's: `test` and
      # `test:int` declare `cache: false` because they talk to Postgres.
      - name: Restore the turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # `.turbo/cache` and not `.turbo`: the parent also holds the daemon's
          # sockets and logs, `runs/` and `cookies/`, which would grow the cache
          # with every run and restore a stale daemon directory.
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # The same SQL `docker/local` mounts into `docker-entrypoint-initdb.d`,
      # run against the service container: one definition of the two roles and
      # the test database, and extensions still arrive by migration `0000`
      # (ADR-0007 as carried by ADR-0061 §1, ADR-0008). The whole directory, not
      # one named file, because that is what compose mounts — `00-roles.sql`
      # arrived exactly that way, and a third init file must not apply locally
      # and not here.
      - name: Create the roles and the test database
        # `PGPASSWORD` rather than the password in the URI alone: `01-test-db.sql`
        # ends with a `\c machxi_test`, and a reconnect that had to re-prompt
        # would hang the job rather than fail it.
        env:
          PGPASSWORD: machxi
        run: |
          for f in docker/local/postgres/init/*.sql; do
            psql "postgres://machxi@localhost:5432/machxi" -v ON_ERROR_STOP=1 -f "$f"
          done

      # The documented setup, verbatim (README §Quick start). The three files
      # are committed examples holding no secret; copying them is what makes
      # `pnpm size` build the two SPAs with the same `VITE_*` values a
      # developer builds them with.
      - name: Copy the example environment files
        run: |
          cp .env.example .env
          cp apps/admin/.env.example apps/admin/.env
          cp apps/customer/.env.example apps/customer/.env

      - run: pnpm lint

      - run: pnpm check-types

      - run: pnpm test

      - run: pnpm size

      - run: pnpm format:check
